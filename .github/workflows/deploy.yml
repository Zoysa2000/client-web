name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install node modules
        run: npm ci --legacy-peer-deps

      - name: Run build
        run: npm run build

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/client-web:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/client-web:${{ env.IMAGE_TAG }}

      - name: Update Kubernetes manifest image
        run: |
          sed -i "s|image: .*client-web:.*|image: ${{ secrets.DOCKER_USERNAME }}/client-web:${{ env.IMAGE_TAG }}|g" k8/client-web-deployment.yaml

      - name: Commit and push 
        run: |
          git config user.name "thilina-dev"
          git config user.email "thilinadezpysa2000@gmail.com"
          git add k8/client-web-deployment.yaml
          git commit -m "Update client-web image to ${{ env.IMAGE_TAG }}" || echo "No changes to commit"
          git push



           
        


      


     